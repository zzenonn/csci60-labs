# Lab 4 network: six hosts and four switches. No IP addresses yet.
#
#      h0  h1        h2  h3        h4  h5
#       \  /          \  /          \  /
#        s0            s1            s2            s3  (not connected yet)
#
name: lab4
prefix: ""          # name the containers just h0 .. h5

topology:
  defaults:
    kind: linux
    image: csci60/host
    network-mode: none     # each host has only the links listed below
  nodes:
    h0: {}
    h1: {}
    h2: {}
    h3: {}
    h4: {}
    h5: {}
    s0: {kind: ovs-bridge}
    s1: {kind: ovs-bridge}
    s2: {kind: ovs-bridge}
    s3: {kind: ovs-bridge}
  links:
    - {endpoints: ["h0:eth0", "s0:s0-eth1"], mtu: 1500}
    - {endpoints: ["h1:eth0", "s0:s0-eth2"], mtu: 1500}
    - {endpoints: ["h2:eth0", "s1:s1-eth1"], mtu: 1500}
    - {endpoints: ["h3:eth0", "s1:s1-eth2"], mtu: 1500}
    - {endpoints: ["h4:eth0", "s2:s2-eth1"], mtu: 1500}
    - {endpoints: ["h5:eth0", "s2:s2-eth2"], mtu: 1500}
